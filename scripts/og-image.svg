<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Page background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#FDD7B8"/>
      <stop offset="48%"  stop-color="#9B5BA3"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>

    <!-- Dark scrim over left panel for text legibility -->
    <linearGradient id="scrim" x1="0" y1="0" x2="620" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0d0d1f" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#0d0d1f" stop-opacity="0"/>
    </linearGradient>

    <!-- Radial glow behind the network center -->
    <radialGradient id="netGlow" cx="900" cy="315" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#DC3627" stop-opacity="0.18"/>
      <stop offset="60%"  stop-color="#9B5BA3" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#DC3627" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft glow filter on storefront -->
    <filter id="sfGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Node glow filter -->
    <filter id="nodeGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Text shadow for headline -->
    <filter id="textShadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- ─── Background ───────────────────────────────────────── -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Left scrim for text legibility -->
  <rect width="640" height="630" fill="url(#scrim)"/>

  <!-- Subtle top edge line -->
  <rect x="0" y="0" width="1200" height="3" fill="#DC3627" opacity="0.7"/>

  <!-- ─── Left: Text Content ───────────────────────────────── -->

  <!-- BEMORE badge pill -->
  <rect x="64" y="72" width="130" height="32" rx="16" fill="#DC3627"/>
  <text x="129" y="93" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700"
        fill="white" text-anchor="middle" letter-spacing="2">BEMORE</text>

  <!-- Main headline line 1 -->
  <text x="64" y="200" font-family="Arial Black, Arial, sans-serif" font-size="68" font-weight="900"
        fill="white" filter="url(#textShadow)">Community</text>

  <!-- Main headline line 2: "Decides." in rust -->
  <text x="64" y="278" font-family="Arial Black, Arial, sans-serif" font-size="68" font-weight="900"
        fill="#DC3627">Decides.</text>

  <!-- Main headline line 3 -->
  <text x="64" y="356" font-family="Arial Black, Arial, sans-serif" font-size="56" font-weight="900"
        fill="white" opacity="0.95">You Succeed.</text>

  <!-- Separator line -->
  <rect x="64" y="386" width="60" height="3" rx="2" fill="#DC3627" opacity="0.8"/>

  <!-- Body copy -->
  <text x="64" y="424" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="white" opacity="0.75">
    Real demand. Validated concepts.
  </text>
  <text x="64" y="448" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="white" opacity="0.75">
    Your neighborhood's voice, finally heard.
  </text>

  <!-- Stats row -->
  <text x="64" y="514" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700"
        fill="white" opacity="0.9" letter-spacing="0.5">50+ STOREFRONTS</text>
  <text x="235" y="514" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="white" opacity="0.35">|</text>
  <text x="248" y="514" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700"
        fill="white" opacity="0.9" letter-spacing="0.5">800+ VOICES</text>

  <!-- URL -->
  <text x="64" y="560" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="white" opacity="0.45"
        letter-spacing="0.5">bemoreinc.com</text>

  <!-- ─── Divider ───────────────────────────────────────────── -->
  <line x1="620" y1="40" x2="620" y2="590" stroke="white" stroke-opacity="0.08" stroke-width="1"/>

  <!-- ─── Right: Community Network Visualization ───────────── -->
  <!-- Network center: (900, 315) -->

  <!-- Background radial glow -->
  <circle cx="900" cy="315" r="230" fill="url(#netGlow)"/>

  <!-- Orbit rings (subtle guide rings) -->
  <circle cx="900" cy="315" r="115" fill="none" stroke="white" stroke-opacity="0.06" stroke-width="1"/>
  <circle cx="900" cy="315" r="165" fill="none" stroke="white" stroke-opacity="0.05" stroke-width="1"/>
  <circle cx="900" cy="315" r="210" fill="none" stroke="white" stroke-opacity="0.04" stroke-width="1"/>

  <!-- ─── Connection lines (center → each node) ─────────────── -->
  <!-- Using computed positions from CommunityNodesAnimation at scale 1.4 -->
  <!-- angle 15,  r=161: (1036, 357) -->
  <line x1="900" y1="315" x2="1036" y2="357" stroke="#DC3627" stroke-opacity="0.22" stroke-width="1.2"/>
  <!-- angle 45,  r=140: (979, 414) -->
  <line x1="900" y1="315" x2="979" y2="414" stroke="#DC3627" stroke-opacity="0.22" stroke-width="1.2"/>
  <!-- angle 80,  r=179: (911, 492) -->
  <line x1="900" y1="315" x2="911" y2="492" stroke="#DC3627" stroke-opacity="0.22" stroke-width="1.2"/>
  <!-- angle 115, r=151: (836, 452) -->
  <line x1="900" y1="315" x2="836" y2="452" stroke="#DC3627" stroke-opacity="0.22" stroke-width="1.2"/>
  <!-- angle 150, r=168: (754, 399) -->
  <line x1="900" y1="315" x2="754" y2="399" stroke="#DC3627" stroke-opacity="0.22" stroke-width="1.2"/>
  <!-- angle 185, r=133: (768, 303) -->
  <line x1="900" y1="315" x2="768" y2="303" stroke="#DC3627" stroke-opacity="0.22" stroke-width="1.2"/>
  <!-- angle 220, r=174: (767, 203) -->
  <line x1="900" y1="315" x2="767" y2="203" stroke="#DC3627" stroke-opacity="0.22" stroke-width="1.2"/>
  <!-- angle 255, r=154: (860, 166) -->
  <line x1="900" y1="315" x2="860" y2="166" stroke="#DC3627" stroke-opacity="0.22" stroke-width="1.2"/>
  <!-- angle 290, r=140: (948, 183) -->
  <line x1="900" y1="315" x2="948" y2="183" stroke="#DC3627" stroke-opacity="0.22" stroke-width="1.2"/>
  <!-- angle 320, r=185: (1042, 196) -->
  <line x1="900" y1="315" x2="1042" y2="196" stroke="#DC3627" stroke-opacity="0.22" stroke-width="1.2"/>
  <!-- angle 30,  r=203: (1076, 417) -->
  <line x1="900" y1="315" x2="1076" y2="417" stroke="#DC3627" stroke-opacity="0.18" stroke-width="1"/>
  <!-- angle 165, r=192: (714, 365) -->
  <line x1="900" y1="315" x2="714" y2="365" stroke="#DC3627" stroke-opacity="0.18" stroke-width="1"/>
  <!-- angle 240, r=199: (801, 143) -->
  <line x1="900" y1="315" x2="801" y2="143" stroke="#DC3627" stroke-opacity="0.18" stroke-width="1"/>
  <!-- angle 340, r=188: (1077, 251) -->
  <line x1="900" y1="315" x2="1077" y2="251" stroke="#DC3627" stroke-opacity="0.18" stroke-width="1"/>

  <!-- ─── Community nodes ───────────────────────────────────── -->
  <g filter="url(#nodeGlow)">
    <!-- angle 15 -->
    <circle cx="1036" cy="357" r="11" fill="#DC3627" opacity="0.55"/>
    <!-- angle 45 -->
    <circle cx="979"  cy="414" r="9"  fill="#DC3627" opacity="0.5"/>
    <!-- angle 80 -->
    <circle cx="911"  cy="492" r="12" fill="#DC3627" opacity="0.55"/>
    <!-- angle 115 -->
    <circle cx="836"  cy="452" r="10" fill="#DC3627" opacity="0.5"/>
    <!-- angle 150 -->
    <circle cx="754"  cy="399" r="11" fill="#DC3627" opacity="0.55"/>
    <!-- angle 185 -->
    <circle cx="768"  cy="303" r="9"  fill="#DC3627" opacity="0.5"/>
    <!-- angle 220 -->
    <circle cx="767"  cy="203" r="12" fill="#DC3627" opacity="0.55"/>
    <!-- angle 255 -->
    <circle cx="860"  cy="166" r="10" fill="#DC3627" opacity="0.5"/>
    <!-- angle 290 -->
    <circle cx="948"  cy="183" r="9"  fill="#DC3627" opacity="0.5"/>
    <!-- angle 320 -->
    <circle cx="1042" cy="196" r="11" fill="#DC3627" opacity="0.55"/>
    <!-- angle 30  (desktop extra) -->
    <circle cx="1076" cy="417" r="10" fill="#9B5BA3" opacity="0.55"/>
    <!-- angle 165 (desktop extra) -->
    <circle cx="714"  cy="365" r="9"  fill="#9B5BA3" opacity="0.5"/>
    <!-- angle 240 (desktop extra) -->
    <circle cx="801"  cy="143" r="11" fill="#9B5BA3" opacity="0.55"/>
    <!-- angle 340 (desktop extra) -->
    <circle cx="1077" cy="251" r="10" fill="#9B5BA3" opacity="0.5"/>
  </g>

  <!-- ─── Central storefront (scaled 1.4× from component) ───── -->
  <!-- Glow ring -->
  <circle cx="900" cy="315" r="72" fill="#DC3627" opacity="0.12"/>
  <circle cx="900" cy="315" r="56" fill="#DC3627" opacity="0.08"/>

  <!-- Storefront icon -->
  <g filter="url(#sfGlow)" stroke="#DC3627" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Building outline -->
    <rect x="844" y="253" width="112" height="123" rx="2" stroke-width="2.2"/>
    <!-- Awning -->
    <path d="M 838,253 L 900,225 L 962,253" stroke-width="2.2"/>
    <!-- Sign bar -->
    <rect x="857" y="253" width="86" height="22" rx="2" fill="#DC3627" fill-opacity="0.2" stroke-width="1.5"/>
    <!-- Left window -->
    <rect x="851" y="276" width="31" height="28" rx="2" fill="#DC3627" fill-opacity="0.08" stroke-width="1.5"/>
    <!-- Right window -->
    <rect x="918" y="276" width="31" height="28" rx="2" fill="#DC3627" fill-opacity="0.08" stroke-width="1.5"/>
    <!-- Door -->
    <rect x="879" y="327" width="42" height="49" rx="2" stroke-width="2"/>
    <!-- Door knob -->
    <circle cx="914" cy="353" r="3.8" fill="#DC3627" stroke="none"/>
  </g>
</svg>
